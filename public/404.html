    <meta name="robots" content="noindex, follow" />
    <script>
      (function () {
        // Gracefully upgrade any legacy HashRouter bookmarks (/#/about -> /about/)
        var hash = window.location.hash || '';
        if (hash.indexOf('#/') === 0) {
          var targetPath = hash.slice(1).replace(/\/+$/, '');
          var cleanUrl = window.location.origin + (targetPath ? targetPath + '/' : '/');
          window.location.replace(cleanUrl);
        }
      })();
    </script>
